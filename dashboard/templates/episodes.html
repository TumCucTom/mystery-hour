<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Episodes — Mystery Hour</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    :root { --primary: #6c5ce7; }
    body { margin: 0; padding: 0; }
    nav { border-bottom: 1px solid #eee; padding: 0.5rem 1rem; display: flex; gap: 1rem; align-items: center; }
    nav a { color: var(--primary); text-decoration: none; font-weight: 600; }
    nav a:hover { text-decoration: underline; }
    nav .logo { font-size: 1.2rem; font-weight: 700; color: #222; margin-right: auto; }
    .container { max-width: 1200px; margin: 0 auto; padding: 1rem; }
    input#epSearch { width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; margin-bottom: 1rem; }
    .ep-card { background: white; border: 1px solid #e0e0e0; border-radius: 8px; padding: 0.9rem; margin: 0.5rem 0; display: grid; grid-template-columns: 80px 1fr auto; gap: 1rem; align-items: center; cursor: pointer; }
    .ep-card:hover { border-color: var(--primary); }
    .ep-num { font-size: 1.5rem; font-weight: 700; color: var(--primary); text-align: center; }
    .ep-info h3 { margin: 0 0 0.3rem; font-size: 1rem; }
    .ep-info p { margin: 0; font-size: 0.8rem; color: #666; }
    .ep-stats { text-align: right; font-size: 0.8rem; color: #555; }
    .ep-stats .big { font-size: 1.1rem; font-weight: 700; color: #222; }
    .ep-detail { background: white; border: 1px solid var(--primary); border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    .q-item { border-bottom: 1px solid #f0f0f0; padding: 0.6rem 0; }
    .q-item:last-child { border-bottom: none; }
    .q-item .q-text { font-size: 0.9rem; }
    .q-item .q-meta { font-size: 0.75rem; color: #888; margin-top: 0.2rem; }
    .badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.7rem; font-weight: 600; }
    .badge-resolved { background: #d4edda; color: #155724; }
    .badge-unresolved { background: #fff3cd; color: #856404; }
    .topic-tag { display: inline-block; background: #f0f0ff; color: var(--primary); padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.7rem; margin: 0.1rem; }
  </style>
</head>
<body>
<nav>
  <span class="logo">🔮 Mystery Hour</span>
  <a href="/">Overview</a>
  <a href="/clusters">Clusters</a>
  <a href="/episodes">Episodes</a>
  <a href="/search">Search</a>
</nav>

<div class="container">
  <h1>📻 All Episodes</h1>
  <p>Click any episode to explore its Q&A.</p>
  <input type="text" id="epSearch" placeholder="Search episodes (e.g. ep_042 or 'football')...">

  <div id="epList"></div>
  <div id="epDetail" style="display:none;"></div>
</div>

<script>
let allEps = [];

async function init() {
  // Load first 100 episode stats
  const resp = await fetch('/api/episode/0');
  // Actually we need all — load from stats
  allEps = {{ episode_stats | tojson }};
  renderEps(allEps);
}

function renderEps(eps) {
  const list = document.getElementById('epList');
  list.innerHTML = '';
  eps.forEach(ep => {
    const card = document.createElement('div');
    card.className = 'ep-card';
    const epNum = ep.episode.replace('ep_', '');
    card.innerHTML = `
      <div class="ep-num">${epNum}</div>
      <div class="ep-info">
        <h3>${ep.episode}</h3>
        <p>Topics: ${(ep.topics || []).join(', ') || 'various'}</p>
      </div>
      <div class="ep-stats">
        <div class="big">${ep.n_questions}</div>
        <div>questions</div>
        <div>${ep.resolved} resolved</div>
      </div>
    `;
    card.onclick = () => loadEp(ep.episode);
    list.appendChild(card);
  });
}

async function loadEp(episode) {
  // episode like "ep_042"
  const idx = parseInt(episode.replace('ep_', ''));
  const resp = await fetch(`/api/episode/${idx}`);
  const ep = await resp.json();
  const detail = document.getElementById('epDetail');
  detail.style.display = 'block';
  detail.innerHTML = `
    <h2>${episode}</h2>
    <p>${ep.questions ? ep.questions.length : 0} questions</p>
    <div class="ep-detail">
      ${(ep.questions || []).map(q => `
        <div class="q-item">
          <div class="q-text"><strong>${q.caller || 'anonymous'}:</strong> ${q.question}</div>
          <div class="q-meta">
            <span class="badge ${q.resolved ? 'badge-resolved' : 'badge-unresolved'}">${q.resolved ? 'Resolved' : 'Unresolved'}</span>
            <span>${(q.answers || []).length} answers</span>
            ${(q.topics || []).map(t => `<span class="topic-tag">${t}</span>`).join('')}
          </div>
          ${(q.answers || []).map(a => `
            <div style="margin-left:1rem;font-size:0.82rem;color:#444;margin-top:0.3rem;">
              <strong>${a.caller}:</strong> ${a.answer.substring(0,150)}${a.answer.length > 150 ? '...' : ''}
              ${a.overturned ? ' <span style="color:#e17055">↩ overturned</span>' : ''}
            </div>
          `).join('')}
        </div>
      `).join('')}
    </div>
  `;
  window.scrollTo({ top: detail.offsetTop - 80, behavior: 'smooth' });
}

document.getElementById('epSearch').oninput = e => {
  const q = e.target.value.toLowerCase();
  const filtered = allEps.filter(ep =>
    ep.episode.toLowerCase().includes(q) ||
    (ep.topics || []).some(t => t.toLowerCase().includes(q))
  );
  renderEps(filtered);
};

init();
</script>
</body>
</html>
